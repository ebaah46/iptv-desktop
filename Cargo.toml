[package]
name = "iptv_desktop"
version = "0.4.2"
edition = "2024"

[dependencies]
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libcore = {package = "core", git = "https://github.com/ebaah46/iptv-core.git"}
libcore_api = {package = "iptv-adapter-api", git = "https://github.com/ebaah46/iptv-core.git"}
libcore_cache = {package = "iptv-adapter-cache", git = "https://github.com/ebaah46/iptv-core.git"}
libcore_persistence = {package = "iptv-adapter-persistence", git = "https://github.com/ebaah46/iptv-core.git"}
anyhow = "1.0.104"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
env_logger = "0.11.11"
log = "0.4.34"
qtbridge = {version = "0.4", features=["linkme"]}


[profile.release]
debug = true             # Keeps debug symbols (maps hex addresses to function names)
split-debuginfo = "packed" # Ensures symbols are generated into a format the profiler can grab
strip = "none"           # Guarantees symbols aren't stripped later
